# .github/workflows/deploy.yml



name: Build and Deploy to ECS

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cloudops-api
  ECS_CLUSTER: cloudops-cluster
  ECS_SERVICE: cloudops-api-service
  CONTAINER_NAME: cloudops-api

permissions:
  id-token: write
  contents: read

jobs:
   build-and-deploy:
    name: Build, Scan and Deploy
    runs-on: ubuntu-latest

    steps:
        # Step 1 — Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

        # Step 2 — Configure AWS credentials via OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::326709068429:role/GitHubActionsRole
          aws-region: us-east-1

        # Step 3 — Login to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

        # Step 4 — Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t ${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            -t ${{ env.ECR_REPOSITORY }}:latest \
            ./app

        # Step 5 — Scan image with Trivy
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

        # Step 6 — Push to ECR
      - name: Push to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag ${{ env.ECR_REPOSITORY }}:latest \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker tag ${{ env.ECR_REPOSITORY }}:latest \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

        # Step 7 — Download current task definition
      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition cloudops-api \
            --query taskDefinition \
            > task-def.json

        # Step 8 — Update task definition with new image
      - name: Update ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

        # Step 9 — Deploy to ECS
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
